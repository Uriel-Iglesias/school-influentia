<style>
:root {
  --bg: #F3F7FC; --bg-2: #FFFFFF; --bg-3: #EAF1F9; --bg-4: #DCE7F3;
  --linea: rgba(12, 30, 66, 0.12); --linea-2: rgba(12, 30, 66, 0.22);
  --fg: #0A1530; --muted: #4A5B76; --flojo: #66778F;
  --acento: #0072B8; --acento-suave: rgba(0, 114, 184, 0.10); --acento-texto: #005E99;
  --ok: #067350; --ok-suave: rgba(6, 115, 80, 0.10); --sobre-color: #fff;
  --mal: #C3213D; --mal-suave: rgba(195, 33, 61, 0.08);
  --aviso: #9A5B00; --aviso-suave: rgba(214, 140, 0, 0.12);
  --cab: rgba(243, 247, 252, 0.88);
  --hover: rgba(12, 30, 66, 0.05);
  --sombra: 0 18px 40px -28px rgba(12, 30, 66, 0.45);
  --tinta: #04101F;
  --boton: linear-gradient(135deg, #00EAFF 0%, #009FFF 100%);
  --grad: linear-gradient(135deg, #00C8E0 0%, #009FFF 50%, #7641FF 100%);
  --radio: 18px; --radio-s: 12px;
  --titulo: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --texto: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ancho: 1120px; --lado: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070C18; --bg-2: #0C1427; --bg-3: #121D36; --bg-4: #18264A;
    --linea: rgba(154, 171, 194, 0.16); --linea-2: rgba(154, 171, 194, 0.30);
    --fg: #EEF4F8; --muted: #9AABC2; --flojo: #8394AE;
    --acento: #00EAFF; --acento-suave: rgba(0, 234, 255, 0.10); --acento-texto: #00EAFF; --sobre-color: #04101F;
    --ok: #2BE4A7; --ok-suave: rgba(43, 228, 167, 0.11);
    --mal: #FF5C78; --mal-suave: rgba(255, 79, 110, 0.11);
    --aviso: #FFC24B; --aviso-suave: rgba(255, 194, 75, 0.12);
    --cab: rgba(7, 12, 24, 0.84);
    --hover: rgba(255, 255, 255, 0.06);
    --sombra: 0 18px 40px -24px rgba(0, 0, 0, 0.8);
    --grad: linear-gradient(135deg, #00EAFF 0%, #009FFF 50%, #7641FF 100%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070C18; --bg-2: #0C1427; --bg-3: #121D36; --bg-4: #18264A;
  --linea: rgba(154, 171, 194, 0.16); --linea-2: rgba(154, 171, 194, 0.30);
  --fg: #EEF4F8; --muted: #9AABC2; --flojo: #8394AE;
  --acento: #00EAFF; --acento-suave: rgba(0, 234, 255, 0.10); --acento-texto: #00EAFF; --sobre-color: #04101F;
  --ok: #2BE4A7; --ok-suave: rgba(43, 228, 167, 0.11);
  --mal: #FF5C78; --mal-suave: rgba(255, 79, 110, 0.11);
  --aviso: #FFC24B; --aviso-suave: rgba(255, 194, 75, 0.12);
  --cab: rgba(7, 12, 24, 0.84);
  --hover: rgba(255, 255, 255, 0.06);
  --sombra: 0 18px 40px -24px rgba(0, 0, 0, 0.8);
  --grad: linear-gradient(135deg, #00EAFF 0%, #009FFF 50%, #7641FF 100%);
  color-scheme: dark;
}
@media (min-width: 720px) { :root { --lado: 28px; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 120px; scroll-padding-bottom: 100px; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--texto); font-size: 16px; line-height: 1.6;
  min-height: 100vh; overflow-x: hidden; padding-bottom: 92px;
}
@media (min-width: 820px) { body { padding-bottom: 48px; } }
body.sin-nav { padding-bottom: 48px; }
body.sin-nav .cab__lado { margin-left: auto; }
img, svg, iframe, video, object { max-width: 100%; }
a { color: var(--acento); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--titulo); line-height: 1.2; margin: 0; letter-spacing: -0.01em; overflow-wrap: anywhere; }
h1 { font-size: clamp(1.55rem, 1.2rem + 1.5vw, 2.2rem); }
h2 { font-size: clamp(1.18rem, 1.05rem + 0.6vw, 1.45rem); }
h3 { font-size: 1.06rem; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.saltar { position: absolute; left: 12px; top: -60px; z-index: 60; background: var(--acento); color: var(--bg); font-weight: 700; padding: 10px 16px; border-radius: 10px; }
.saltar:focus { top: 12px; }

/* cabecera */
.cab { position: sticky; top: 0; z-index: 30; background: var(--cab); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--linea); }
.cab__in { max-width: var(--ancho); margin: 0 auto; padding: 10px var(--lado); display: flex; align-items: center; gap: 12px; min-height: 60px; }
.marca { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); flex: 0 1 auto; min-width: 0; min-height: 44px; }
.marca:hover { text-decoration: none; }
.marca .logo { height: 19px; width: auto; display: block; }
@media (min-width: 720px) { .marca .logo { height: 23px; } }
.marca__pill { font-family: var(--titulo); font-weight: 700; font-size: 0.875rem; padding: 3px 9px; border-radius: 999px; background: var(--grad); color: var(--tinta); }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; min-height: 44px; border-radius: 12px; color: var(--muted); font-weight: 600; font-size: 0.93rem; position: relative; }
.nav a:hover { color: var(--fg); background: var(--hover); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--fg); background: var(--acento-suave); }
.nav a[aria-current="page"] .ico { color: var(--acento); }
.contador { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--mal); color: var(--sobre-color); font-size: 0.875rem; font-weight: 700; display: inline-grid; place-items: center; line-height: 1; }
.cab__lado { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.yo { display: flex; align-items: center; gap: 8px; }
.yo__nombre { font-weight: 600; font-size: 0.88rem; color: var(--muted); display: none; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 980px) { .yo__nombre { display: block; } }
@media (max-width: 420px) { .yo .avatar { display: none; } }
@media (max-width: 819px) {
  .cab { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; justify-content: space-around; gap: 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--cab); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--linea); }
  .nav a { flex-direction: column; justify-content: center; gap: 2px; font-size: 0.875rem; padding: 6px 6px; min-height: 52px; flex: 1 1 0; text-align: center; }
  .nav a .contador { position: absolute; top: 2px; right: calc(50% - 26px); }
  .cab__lado { margin-left: auto; }
}

.aviso { max-width: var(--ancho); margin: 16px auto 0; padding: 0 var(--lado); }
/* «Sin conexión»: franja dentro de la cabecera fija, a la vista aunque bajes por la clase */
.cab__red { border-top: 1px solid var(--linea); background: var(--aviso-suave); }
.cab__red__in { max-width: var(--ancho); margin: 0 auto; padding: 6px var(--lado); display: flex; align-items: center; gap: 10px; font-size: 0.9375rem; }
.cab__red__in .ico { color: var(--aviso); flex: none; }
.cab__red__in > div { flex: 1 1 auto; min-width: 0; }
.cab__red__in .btn { flex: none; }
.aviso__in { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radio-s); background: var(--aviso-suave); color: var(--fg); border: 1px solid var(--linea); }
.aviso__in .ico { color: var(--aviso); margin-top: 2px; }

.principal { outline: none; }
.envoltorio { max-width: var(--ancho); margin: 0 auto; padding: 24px var(--lado) 32px; }
.pila > * + * { margin-top: 22px; }
.kicker { font-size: 0.95rem; font-weight: 700; color: var(--acento-texto); }
.muted { color: var(--muted); }
.peq { font-size: 0.875rem; }
.migas { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.88rem; }
.migas a { color: var(--muted); display: inline-flex; align-items: center; gap: 4px; min-height: 44px; }
.migas a:hover { color: var(--fg); }
.tarjeta { background: var(--bg-2); border: 1px solid var(--linea); border-radius: var(--radio); box-shadow: var(--sombra); min-width: 0; }
.tarjeta--pad { padding: 20px; }
@media (min-width: 720px) { .tarjeta--pad { padding: 24px; } }
.titulo-seccion { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.titulo-seccion .ico { color: var(--acento); }

.ico { width: 20px; height: 20px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.ico--emo { width: 1em; height: 1em; stroke-width: 1.6; display: block; }
.portada__ico .ico--emo { color: #fff; }
.camino__emoji .ico--emo, .fila-admin__ico .ico--emo { color: var(--acento-texto); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--boton); color: var(--tinta); font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
.btn:hover { text-decoration: none; box-shadow: 0 6px 16px -8px rgba(4, 16, 31, 0.45); transform: translateY(-1px); }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
.btn--grande { min-height: 54px; padding: 0 26px; font-size: 1.04rem; }
.btn--fantasma { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--linea-2); }
.btn--fantasma:hover { background: var(--hover); box-shadow: inset 0 0 0 1px var(--linea-2); }
.btn--suave { background: var(--acento-suave); color: var(--acento-texto); }
.btn--suave:hover { box-shadow: none; }
.btn--peq { min-height: 44px; padding: 0 14px; font-size: 0.88rem; }
.btn--ok { background: var(--ok); color: var(--sobre-color); }
.btn-icono { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.btn-icono:hover { color: var(--fg); background: var(--hover); }
.btn-icono[disabled] { opacity: 0.3; cursor: default; }
.acciones { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 0.875rem; font-weight: 700; background: var(--hover); color: var(--muted); white-space: nowrap; }
.chip .ico { width: 14px; height: 14px; }
.chip--ok { color: var(--ok); background: var(--ok-suave); }
.chip--aviso { color: var(--aviso); background: var(--aviso-suave); }
.chip--cyan { color: var(--acento-texto); background: var(--acento-suave); }
a.chip { min-height: 44px; padding: 0 14px; }
.chip--mal { color: var(--mal); background: var(--mal-suave); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; flex: 0 0 auto; overflow: hidden; background: var(--bg-4); color: var(--fg); font-weight: 700; font-size: 0.875rem; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar--peq { width: 28px; height: 28px; font-size: 0.875rem; }

.barra { height: 8px; border-radius: 999px; background: var(--bg-4); overflow: hidden; }
.barra > span { display: block; height: 100%; border-radius: inherit; background: var(--grad); }
.progreso-linea { display: flex; align-items: center; gap: 12px; }
.progreso-linea .barra { flex: 1 1 auto; }
.progreso-linea b { font-size: 0.875rem; min-width: 40px; text-align: right; }

/* portadas de curso */
.portada { position: relative; aspect-ratio: 16 / 7; border-radius: var(--radio) var(--radio) 0 0; overflow: hidden; display: grid; place-items: center; isolation: isolate; background: radial-gradient(120% 120% at 15% 0%, var(--color, #00B8D9) 0%, #0B1A3C 62%, #070C18 100%); }
.portada__ico { font-size: clamp(2.4rem, 2rem + 2vw, 3.4rem); line-height: 1; filter: drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
.portada__candado { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4, 10, 24, 0.62); color: #fff; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.portada__candado span { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 0.88rem; }
.portada__hecho { position: absolute; top: 10px; right: 10px; }
.portada__hecho .chip { background: rgba(4, 16, 31, 0.75); color: #2BE4A7; }

/* inicio */
.inicio { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .inicio { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } .inicio__lado { position: sticky; top: calc(84px + var(--cab-extra, 0px)); } }
.saludo h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.saludo p { color: var(--muted); margin-top: 6px; font-size: 1.04rem; }
.continuar { display: grid; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
.continuar .portada { border-radius: 0; aspect-ratio: 16 / 6; }
@media (min-width: 720px) { .continuar { grid-template-columns: 240px minmax(0, 1fr); } .continuar .portada { aspect-ratio: auto; min-height: 100%; } }
.continuar__cuerpo { padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.continuar__cuerpo h2 { font-size: clamp(1.15rem, 1.05rem + 0.6vw, 1.5rem); }
.datos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.dato { padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dato b { font-family: var(--titulo); font-size: 1.4rem; line-height: 1.1; }
.dato span { font-size: 0.875rem; color: var(--muted); line-height: 1.3; }
.cursos { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.curso-card { display: flex; flex-direction: column; color: var(--fg); overflow: hidden; transition: transform .15s ease, border-color .15s ease; }
.curso-card:hover { text-decoration: none; transform: translateY(-3px); border-color: var(--linea-2); }
.curso-card .portada { border-radius: 0; }
.curso-card__cuerpo { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; }
.curso-card__cuerpo p { color: var(--muted); font-size: 0.92rem; }
.curso-card__pie { margin-top: auto; padding-top: 6px; }
.ranking { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ranking li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; min-width: 0; }
.ranking li.es-yo { background: var(--acento-suave); }
.ranking__pos { width: 24px; text-align: center; font-weight: 700; color: var(--muted); font-size: 0.9rem; flex: 0 0 auto; }
.ranking__nombre { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.ranking__nombre > span:first-child { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ranking__nombre small { font-size: 0.875rem; color: var(--muted); font-weight: 600; }
.ranking__n { font-weight: 800; font-size: 0.9rem; color: var(--acento); flex: 0 0 auto; }
.ranking__sep { height: 1px; background: var(--linea); margin: 4px 10px; padding: 0 !important; }

/* curso */
.curso-cab { overflow: hidden; }
.curso-cab .portada { border-radius: 0; aspect-ratio: 16 / 5; }
.curso-cab__cuerpo { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.lecciones { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.leccion-fila { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--linea); color: var(--fg); min-width: 0; }
a.leccion-fila:hover { text-decoration: none; border-color: var(--linea-2); background: var(--bg-3); }
.leccion-fila--bloq { color: var(--flojo); background: transparent; border-style: dashed; }
.leccion-fila__n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; font-weight: 700; background: var(--bg-3); color: var(--muted); }
.leccion-fila__n--ok { background: var(--ok-suave); color: var(--ok); }
.leccion-fila__n--sig { background: var(--boton); color: var(--tinta); }
.leccion-fila__t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.leccion-fila__t b { font-weight: 600; overflow-wrap: anywhere; }
.leccion-fila__t span { font-size: 0.875rem; color: var(--muted); }

/* lección */
.leccion { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .leccion { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } .leccion__lado { position: sticky; top: calc(84px + var(--cab-extra, 0px)); } }
.marco { position: relative; aspect-ratio: 16 / 9; border-radius: var(--radio-s); overflow: hidden; background: #000; }
.marco iframe, .marco video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pdf { width: 100%; height: 70vh; min-height: 420px; border: 0; border-radius: var(--radio-s); background: var(--bg-3); display: block; }
@media (max-width: 719px) { .pdf { height: 60vh; min-height: 320px; } }
.bloqueado { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.bloqueado__ico { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-3); color: var(--muted); }
.bloqueado__ico .ico { width: 28px; height: 28px; }
.mini-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.mini-lista a, .mini-lista span.fila { display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-radius: 10px; color: var(--fg); font-size: 0.9rem; min-width: 0; min-height: 48px; }
.mini-lista a:hover { background: var(--hover); text-decoration: none; }
.mini-lista a[aria-current="page"] { background: var(--acento-suave); font-weight: 700; }
.mini-lista span.fila { color: var(--flojo); }
.mini-lista .ico { width: 16px; height: 16px; }
.mini-lista em { font-style: normal; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow-wrap: anywhere; line-height: 1.3; flex: 1 1 auto; min-width: 0; }

/* markdown */
.md { font-size: 1.02rem; }
.md > * + * { margin-top: 14px; }
.md h2 { margin-top: 26px; }
.md h3 { margin-top: 20px; }
.md ul, .md ol { padding-left: 1.3em; margin-bottom: 0; }
.md li + li { margin-top: 6px; }
.md blockquote { margin: 18px 0 0; padding: 14px 18px; border-radius: var(--radio-s); background: var(--acento-suave); font-weight: 600; }
.md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; padding: 2px 6px; border-radius: 6px; background: var(--bg-3); overflow-wrap: anywhere; }
.caja { margin-top: 18px; }
.caja__tit { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 1.15rem; }
.caja__sello { display: inline-grid; place-items: center; min-width: 44px; height: 30px; padding: 0 10px; border-radius: 10px; font-size: 0.875rem; letter-spacing: 0.04em; color: var(--sobre-color); }
.caja--si .caja__sello { background: var(--ok); }
.caja--no .caja__sello { background: var(--mal); }
.caja--pasos .caja__sello { background: var(--boton); color: var(--tinta); }
.tarjetas-md { list-style: none; padding: 0 !important; margin: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.tarjetas-md li { margin: 0 !important; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; border: 1px solid var(--linea); background: var(--bg-2); line-height: 1.45; }
.caja--si .tarjetas-md li { background: var(--ok-suave); border-color: transparent; }
.caja--no .tarjetas-md li { background: var(--mal-suave); border-color: transparent; }
.tarjetas-md .marca-md { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 0.875rem; color: var(--sobre-color); }
.caja--si .marca-md { background: var(--ok); }
.caja--no .marca-md { background: var(--mal); }
.caja--pasos .marca-md { background: var(--boton); color: var(--tinta); }

/* test */
.test fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.test fieldset + fieldset { margin-top: 20px; }
.test legend { font-weight: 700; margin-bottom: 10px; padding: 0; }
.opcion { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--linea-2); cursor: pointer; margin-top: 8px; }
.opcion:hover { background: var(--hover); }
.opcion input { width: 20px; height: 20px; accent-color: var(--acento); flex: 0 0 auto; margin: 0; }
.opcion--sel { border-color: var(--acento); background: var(--acento-suave); }
.opcion--mal { border-color: var(--mal); background: var(--mal-suave); }
.opcion--ok { border-color: var(--ok); background: var(--ok-suave); }
.resultado { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-weight: 600; }
.resultado--mal { background: var(--mal-suave); color: var(--mal); }
.resultado--ok { background: var(--ok-suave); color: var(--ok); }

/* preguntas */
.hilo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.preg { display: flex; gap: 12px; min-width: 0; }
.preg__cuerpo { flex: 1 1 auto; min-width: 0; }
.preg__cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.preg__cab b { font-weight: 700; }
.preg__cab time, .preg__cab a { font-size: 0.875rem; color: var(--muted); }
.preg__texto { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.resp { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--acento-suave); }
.insignia { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 700; color: var(--tinta); background: var(--boton); padding: 3px 10px; border-radius: 999px; }
.insignia .ico { width: 14px; height: 14px; }
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo > span { font-weight: 600; font-size: 0.9rem; }
.campo small { color: var(--muted); font-size: 0.875rem; }
.entrada { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--linea-2); background: var(--bg); color: var(--fg); }
textarea.entrada { min-height: 96px; resize: vertical; line-height: 1.5; }
.entrada:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
.entrada--mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88rem; }
.check { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--acento); }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; }
.filtro { border: 1px solid var(--linea-2); background: transparent; border-radius: 999px; padding: 8px 14px; min-height: 44px; font-weight: 600; font-size: 0.88rem; cursor: pointer; color: var(--muted); }
.filtro[aria-pressed="true"] { background: var(--acento-suave); color: var(--acento-texto); border-color: var(--acento); }

/* admin */
.pestanas { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--linea); }
.pestanas button { border: 0; background: transparent; padding: 10px 14px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.pestanas button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--acento); }
.fila-admin { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--linea); background: var(--bg-2); min-width: 0; }
.fila-admin + .fila-admin { margin-top: 8px; }
.fila-admin__t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.fila-admin__t b { overflow-wrap: anywhere; }
.fila-admin__t span { font-size: 0.875rem; color: var(--muted); }
.fila-admin__ico { font-size: 1.4rem; flex: 0 0 auto; width: 32px; text-align: center; }
.fila-admin__btns { display: flex; gap: 2px; flex: 0 0 auto; }
@media (max-width: 560px) { .fila-admin { flex-wrap: wrap; } .fila-admin__btns { width: 100%; justify-content: flex-end; border-top: 1px solid var(--linea); padding-top: 6px; } }
.rejilla-form { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 720px) { .rejilla-form--2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.sub-bloque { padding: 14px; border-radius: 14px; border: 1px dashed var(--linea-2); display: flex; flex-direction: column; gap: 10px; }
.sub-bloque__cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.estado-subida { display: flex; flex-direction: column; gap: 6px; }
.estado-subida .barra > span { width: 40%; animation: carga 1.2s ease-in-out infinite; }
.barra--pct > span, .estado-subida .barra--pct > span { animation: none; transition: width .3s ease; }
.subida-pct { font-weight: 700; font-variant-numeric: tabular-nums; }
.sin-conexion { max-width: 520px; margin: 7vh auto 0; text-align: center; align-items: center; }
.sin-conexion__ico { display: inline-flex; color: var(--acento-texto); }
.sin-conexion__ico svg { width: 40px; height: 40px; }
.sin-conexion__titulo { font-family: var(--titulo); font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.sin-conexion__texto { font-size: 1.1rem; margin: 0; }
.sin-conexion .btn--enorme, .sin-conexion__otra { justify-content: center; text-align: center; width: 100%; }
.sin-conexion .btn--enorme .btn__txt { flex: 0 1 auto; }
.sin-conexion__ayuda { font-size: 1rem; color: var(--muted); margin: 0; }
.sin-conexion__detalle { width: 100%; font-size: 0.95rem; color: var(--muted); }
.sin-conexion__detalle summary { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; cursor: pointer; font-weight: 600; border-radius: 12px; }
.sin-conexion__detalle summary:hover { color: var(--fg); background: var(--hover); }
.sin-conexion__detalle p { margin: 6px 0 0; overflow-wrap: anywhere; }
.cargando { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 4px; font-size: 1.15rem; font-weight: 700; color: var(--fg); }
.cargando__nota { margin: 0; text-align: center; font-size: 1.05rem; color: var(--muted); }
.cargando__punto { width: 12px; height: 12px; border-radius: 50%; background: var(--acento-texto); animation: latido 1s ease-in-out infinite; }
@keyframes latido { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .cargando__punto { animation: none; } }
.nowrap { white-space: nowrap; }
.entrar { max-width: 520px; margin: 7vh auto 0; text-align: center; align-items: center; }
.entrar__titulo { font-family: var(--titulo); font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.1; margin: 0; }
.entrar__lema { font-size: 1.1rem; margin: 0; }
.entrar .btn--enorme { justify-content: center; text-align: center; }
.entrar .btn--enorme .btn__txt { flex: 0 1 auto; }
.entrar__ayuda { list-style: none; margin: 20px auto 0; padding: 0; display: grid; gap: 12px; justify-items: start; text-align: left; font-size: 1rem; line-height: 1.4; color: var(--fg); }
.entrar__ayuda li { display: flex; align-items: center; gap: 10px; }
.entrar__ayuda b { font-weight: 700; }
.entrar__num { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--acento-suave); color: var(--fg); font-family: var(--titulo); font-weight: 800; font-size: 1rem; }
.yo__salir { min-height: 44px; min-width: 44px; padding: 0 14px; }
@keyframes carga { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
.tabla-envol { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radio-s); border: 1px solid var(--linea); }
.tabla { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 0.9rem; }
.tabla th, .tabla td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--linea); vertical-align: middle; }
.tabla th { font-size: 0.9rem; font-weight: 700; color: var(--muted); background: var(--bg-3); }
.tabla tr:last-child td { border-bottom: 0; }
.celda-pct { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.celda-pct .barra { flex: 1 1 auto; height: 6px; }
.celda-pct b { font-size: 0.875rem; min-width: 36px; text-align: right; }
.persona { display: flex; align-items: center; gap: 8px; min-width: 0; }

.vacio { text-align: center; padding: 36px 20px; color: var(--muted); }
.esq { border-radius: var(--radio); background: linear-gradient(90deg, var(--bg-3), var(--bg-4), var(--bg-3)); background-size: 200% 100%; animation: brillo 1.4s ease-in-out infinite; }
@keyframes brillo { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
.toasts { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; width: calc(100% - 32px); max-width: 420px; pointer-events: none; }
@media (min-width: 820px) { .toasts { bottom: 28px; } }
.toast { background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; box-shadow: var(--sombra); text-align: center; }
.toast--mal { background: var(--mal); color: var(--sobre-color); }
.toast--ok { background: var(--ok); color: var(--sobre-color); }
/* ===== v3: inicio ===== */
.inicio__col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
@media (max-width: 979px) { .inicio__col { display: contents; } }
.mi-prog { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.nivel { flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.nivel__nombre { font-family: var(--titulo); font-size: 1.3rem; line-height: 1.15; }
.nivel__xp { font-weight: 800; color: var(--acento-texto); }
.logros { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); }
@media (max-width: 480px) { .logros { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.logro { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 12px 6px; border-radius: 14px; background: var(--bg-3); min-width: 0; }
.logro__ico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; background: var(--boton); }
.logro b, .logro small { overflow-wrap: normal; word-break: normal; hyphens: manual; }
.logro b { font-size: 0.875rem; line-height: 1.25; }
.logro small { font-size: 0.875rem; line-height: 1.3; color: var(--muted); }
.logro--no .logro__ico { background: var(--bg-4); filter: grayscale(1); opacity: 0.5; }
.logro--no b { color: var(--muted); }

/* ===== v3: curso como camino ===== */
.camino { list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; gap: 14px; }
.camino::before { content: ""; position: absolute; left: 29px; margin-left: -2px; top: 30px; bottom: 30px; width: 4px; background: repeating-linear-gradient(to bottom, var(--linea-2) 0 8px, transparent 8px 16px); }
.camino__paso { position: relative; display: flex; align-items: center; gap: 14px; min-width: 0; }
.camino__nodo { position: relative; z-index: 1; width: 58px; height: 58px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; background: var(--bg-3); color: var(--muted); box-shadow: 0 0 0 5px var(--bg); }
.camino__nodo .ico { width: 24px; height: 24px; stroke-width: 2.6; }
.camino__paso--hecha .camino__nodo { background: var(--ok); color: var(--sobre-color); }
.camino__paso--ahora .camino__nodo { background: var(--boton); color: var(--tinta); box-shadow: 0 0 0 5px var(--bg), 0 0 0 10px var(--acento-suave); animation: latido 2s ease-in-out infinite; }
.camino__paso--bloq .camino__nodo { color: var(--flojo); }
@keyframes latido { 50% { transform: scale(1.07); } }
.camino__tarjeta { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--bg-2); border: 1px solid var(--linea); color: var(--fg); }
a.camino__tarjeta:hover { text-decoration: none; border-color: var(--linea-2); background: var(--bg-3); }
.camino__paso--ahora .camino__tarjeta { border-color: var(--acento); box-shadow: var(--sombra); }
.camino__tarjeta--bloq { background: transparent; border-style: dashed; color: var(--flojo); }
.camino__emoji { font-size: 1.6rem; line-height: 1; flex: 0 0 auto; }
.camino__tarjeta--bloq .camino__emoji { filter: grayscale(1); opacity: 0.5; }
.camino__t { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.camino__t b { font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
.camino__t span { font-size: 0.875rem; color: var(--muted); }
@media (max-width: 480px) { .camino__nodo { width: 48px; height: 48px; } .camino::before { left: 24px; } .camino__tarjeta { padding: 12px; gap: 10px; } }

/* ===== v3: lección ===== */
.lbar { position: sticky; top: calc(70px + var(--cab-extra, 0px)); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--linea); box-shadow: var(--sombra); font-size: 0.875rem; min-width: 0; }
.lbar b { white-space: nowrap; }
.lbar .barra { flex: 1 1 auto; min-width: 40px; }
.lbar__n { white-space: nowrap; font-weight: 800; font-size: 0.95rem; color: var(--fg); }
.lbar__esp { flex: 1 1 auto; }
.leccion-cab { overflow: hidden; }
.leccion-cab .portada { border-radius: 0; aspect-ratio: 16 / 5; }
@media (max-width: 719px) { .leccion-cab .portada { aspect-ratio: 16 / 7; } }
.leccion-cab .portada__ico { font-size: clamp(3.4rem, 2.8rem + 3vw, 5rem); }
.leccion-cab__cuerpo { padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 6px; }
.leccion-cab__franja { height: 8px; background: linear-gradient(90deg, var(--color, #00B8D9), #0B1A3C); }
.md--leccion { font-size: 1.06rem; }
.md > .act { margin-top: 22px; }
.md > .act:first-child { margin-top: 0; }

/* ===== v3: bloques interactivos ===== */
.act { container-type: inline-size; background: var(--bg-2); border: 1px solid var(--linea); border-radius: var(--radio); box-shadow: var(--sombra); padding: 16px; min-width: 0; font-size: 1rem; }
@media (min-width: 720px) { .act { padding: 22px; } }
.act > * + * { margin-top: 12px; }
.act ul, .act ol { list-style: none; margin: 0; padding: 0; }
.act li + li { margin-top: 0; }
.act__cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.act__tipo { font-size: 0.92rem; font-weight: 800; color: var(--acento-texto); }
/* Emoji delante de una etiqueta: en su propio hueco (en negrita se pegaba a la palabra). */
.emo { display: inline-block; margin-right: 0.4em; font-weight: 400; }
.act .act__tit { margin-top: 4px; font-size: 1.15rem; }
.act__pie { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.act__cuerpo { display: flex; flex-direction: column; gap: 12px; }
.tarjeta .act { box-shadow: none; }
.act__nota { font-family: var(--titulo); font-weight: 700; font-size: 1.15rem; }
.fb { line-height: 1.45; }
.fb--ok { color: var(--ok); }
.fb--mal { color: var(--mal); }
.flips { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
.flip { appearance: none; -webkit-appearance: none; border: 0; padding: 0; margin: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; perspective: 1000px; border-radius: 16px; display: grid; }
.flip__in { display: grid; border-radius: 16px; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2, .7, .2, 1); }
.flip[aria-pressed="true"] .flip__in { transform: rotateY(180deg); }
.flip__cara { grid-area: 1 / 1; min-height: 128px; padding: 16px; border-radius: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; line-height: 1.4; -webkit-backface-visibility: hidden; backface-visibility: hidden; overflow-wrap: anywhere; }
.flip__frente { background: var(--bg-3); border: 1px solid var(--linea); font-weight: 600; }
.flip:hover .flip__frente { border-color: var(--linea-2); }
.flip__dorso { transform: rotateY(180deg); background: var(--boton); color: var(--tinta); font-weight: 700; font-size: 1.05rem; justify-content: center; }
.flip__pista { font-size: 0.875rem; font-weight: 800; color: var(--acento-texto); }
.clas { display: flex; flex-direction: column; gap: 10px; }
.clas__item { padding: 12px 14px; border-radius: 14px; background: var(--bg-3); display: flex; flex-direction: column; gap: 10px; }
.clas__item--ok { background: var(--ok-suave); }
.clas__item--mal { background: var(--mal-suave); }
.clas__txt { font-weight: 600; }
.clas__btns { display: flex; flex-wrap: wrap; gap: 8px; }
.opc-btn { flex: 1 1 140px; min-height: 46px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--linea-2); background: var(--bg-2); color: var(--fg); font-weight: 700; cursor: pointer; }
.opc-btn:hover { background: var(--hover); }
.opc-btn[aria-disabled="true"] { cursor: default; opacity: 0.6; }
.opc-btn[aria-disabled="true"]:hover { background: var(--bg-2); }
.opc-btn[aria-pressed="true"] { opacity: 1; border-width: 2px; border-color: var(--fg); }
.esc__sit { padding: 14px 16px; border-radius: 14px; background: var(--bg-3); font-weight: 600; }
.esc__sit p + p { margin-top: 4px; }
.esc__ops { display: flex; flex-direction: column; gap: 8px; }
.esc__op { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--linea-2); background: var(--bg-2); color: var(--fg); font-weight: 600; text-align: left; cursor: pointer; }
.esc__op:hover { background: var(--hover); }
.esc__op--ok, .esc__op--ok:hover { border-color: var(--ok); background: var(--ok-suave); }
.esc__op--mal, .esc__op--mal:hover { border-color: var(--mal); background: var(--mal-suave); }
.esc__letra { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-4); font-weight: 800; font-size: 0.875rem; }
.esc__op--ok .esc__letra { background: var(--ok); color: var(--sobre-color); }
.esc__op--mal .esc__letra { background: var(--mal); color: var(--sobre-color); }
.esc__ops .fb { padding: 0 6px 4px; }
.rev { display: flex; flex-direction: column; gap: 10px; }
.rev__paso { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--bg-3); }
.rev__paso--nuevo { animation: entra .35s ease both; }
.rev__n { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--boton); color: var(--tinta); font-weight: 800; font-size: 0.88rem; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.comp { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
@container (min-width: 520px) { .comp { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.comp__col { padding: 14px 16px; border-radius: 14px; display: flex; flex-direction: column; gap: 6px; }
.comp__col--mal { background: var(--mal-suave); }
.comp__col--bien { background: var(--ok-suave); }
.comp__col p { font-weight: 600; }
.comp__etq { font-size: 0.95rem; font-weight: 800; }
.comp__col--mal .comp__etq { color: var(--mal); }
.comp__col--bien .comp__etq { color: var(--ok); }
.comp__porque { padding: 12px 14px; border-radius: 14px; background: var(--aviso-suave); font-weight: 600; }
.prompt__txt { margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--bg-3); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt__aviso { font-weight: 700; color: var(--aviso); }
.flujo { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.flujo__paso { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--bg-3); font-weight: 600; line-height: 1.35; min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.flujo__emoji { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 1.45rem; background: var(--bg-2); font-weight: 800; }
.flujo__flecha { justify-self: center; align-self: center; color: var(--acento); font-weight: 800; font-size: 1.2rem; line-height: 1; transform: rotate(90deg); }
@container (min-width: 560px) {
  .flujo:not(.flujo--largo) { grid-template-columns: var(--cols); }
  .flujo:not(.flujo--largo) .flujo__paso { flex-direction: column; justify-content: flex-start; text-align: center; padding: 14px 8px; font-size: 0.92rem; }
  .flujo:not(.flujo--largo) .flujo__flecha { transform: none; }
}
.act--clave { background: radial-gradient(130% 160% at 0% 0%, #0E3A6E 0%, #0B1A3C 55%, #070C18 100%); color: #fff; border-color: transparent; }
.act--clave .act__tipo, .act--clave a { color: #00EAFF; }
.act--clave code { background: rgba(255, 255, 255, 0.12); }
.clave__txt { font-family: 'Montserrat', system-ui, sans-serif; font-weight: 700; font-size: clamp(1.25rem, 1.05rem + 1vw, 1.7rem); line-height: 1.3; }
.clave__txt p + p { margin-top: 8px; }

/* ===== v3: test y celebración ===== */
.opcion__txt { flex: 1 1 auto; min-width: 0; }
.opcion__marca { flex: 0 0 auto; }
.fb-q { margin-top: 10px; padding: 10px 14px; border-radius: 12px; line-height: 1.45; }
.fb-q--ok { background: var(--ok-suave); }
.fb-q--mal { background: var(--mal-suave); }
.fb-q--ok b { color: var(--ok); }
.fb-q--mal b { color: var(--mal); }
.fiesta { margin-top: 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 12px; border-radius: var(--radio); background: var(--acento-suave); }
.fiesta__emoji { font-size: 2.6rem; line-height: 1; }
.fiesta__xp { font-family: var(--titulo); font-size: clamp(2rem, 1.6rem + 2vw, 2.8rem); line-height: 1.1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; animation: entra .45s ease both; }
.fiesta__txt { font-weight: 700; font-size: 1.1rem; }
.confeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }

/* ===== v3: admin ===== */
.editor-doble { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .editor-doble { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.previa { border: 1px dashed var(--linea-2); border-radius: 14px; padding: 14px; max-height: 760px; overflow: auto; background: var(--bg); min-width: 0; }
.ayuda summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
.pdf-plegado { margin-top: 10px; }
.pdf-plegado summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; color: var(--acento-texto); }
.ejemplos { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); margin-top: 10px; }
.ejemplo { padding: 12px; border-radius: 12px; background: var(--bg-3); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ejemplo pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--bg-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.875rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
/* ---------- v3.1: tú escribes → Claude hace ---------- */
.pide { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.pide__fila { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 10px; }
.pide__tu, .pide__claude { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; min-width: 0; }
.pide__tu { background: var(--bg-3); border: 1px solid var(--linea); }
.pide__claude { background: var(--acento-suave); color: var(--fg); }
.pide__etq { font-size: 0.92rem; font-weight: 800; color: var(--muted); }
.pide__claude .pide__etq { color: var(--acento-texto); }
.pide__frase { font-weight: 700; font-size: 1.04rem; line-height: 1.4; overflow-wrap: anywhere; }
.pide__acc { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: auto; }
.pide__ok { font-size: 0.875rem; font-weight: 700; color: var(--ok); }
.pide__flecha { align-self: center; font-size: 1.4rem; font-weight: 800; color: var(--acento-texto); }
.pide__fila--info .pide__tu { background: var(--bg-3); }
@container (max-width: 520px) {
  .pide__fila { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .pide__flecha { justify-self: center; transform: rotate(90deg); line-height: 1; }
}
/* ---------- v3.1: pasos de la primera clase ---------- */
.act--paso { padding: 18px; }
.paso__cab { justify-content: flex-start; flex-wrap: nowrap; gap: 14px; }
.paso__n { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--boton); color: var(--tinta); font-family: var(--titulo); font-weight: 800; font-size: 1.5rem; }
.paso__cabtxt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.paso__tit { font-size: 1.25rem; line-height: 1.25; margin: 0; }
.paso__p { margin: 0; font-size: 1.04rem; }
.paso__juego { padding: 12px; border-radius: 14px; background: var(--bg-3); }
.paso__accion { display: flex; flex-direction: column; gap: 10px; }
.paso__fila { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.paso__btn { flex: 1 1 190px; min-height: 58px; font-size: 1.1rem; }
.paso__fila .paso__hecho { flex: 0 0 auto; min-height: 58px; }
.paso__copia { font-size: 1.1rem; font-weight: 700; text-align: center; }
.paso__pie { justify-content: flex-end; }
.paso__hecho { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px 0 10px; border-radius: 999px; border: 2px solid var(--linea-2); background: var(--bg-2); color: var(--fg); font-weight: 800; font-size: 1rem; cursor: pointer; }
.paso__hecho:hover { background: var(--hover); }
.paso__check { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--linea-2); color: transparent; font-weight: 900; }
.paso__hecho[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-suave); }
.paso__hecho[aria-pressed="true"] .paso__check { background: var(--ok); border-color: var(--ok); color: var(--sobre-color); }
.act--paso.paso--hecho { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset, var(--sombra); }
.act--paso.paso--hecho .paso__n { background: var(--ok); color: var(--sobre-color); }
/* ---------- v3.1: mini-test ---------- */
.qz { display: flex; flex-direction: column; gap: 14px; }
.qz__cab { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.qz__puntos { display: flex; gap: 8px; align-items: center; }
.qz__punto { width: 14px; height: 14px; border-radius: 50%; background: var(--bg-4); border: 2px solid var(--linea-2); }
.qz__punto--ahora { border-color: var(--acento); background: var(--acento-suave); transform: scale(1.2); }
.qz__punto--ok { background: var(--ok); border-color: var(--ok); }
.qz__punto--mal { background: var(--mal); border-color: var(--mal); }
.qz__num { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.qz__racha { margin-left: auto; padding: 3px 10px; border-radius: 999px; background: var(--aviso-suave); font-weight: 800; font-size: 0.88rem; animation: latido .5s ease 1; }
.qz__preg { margin: 0; font-family: var(--titulo); font-size: clamp(1.2rem, 1.05rem + 0.8vw, 1.5rem); line-height: 1.3; outline: none; }
.qz__ops { display: flex; flex-direction: column; gap: 10px; }
.qz__op { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--linea-2); background: var(--bg-2); color: var(--fg); font: inherit; font-size: 1.05rem; font-weight: 700; text-align: left; cursor: pointer; transition: transform .12s ease, background .12s ease; }
.qz__op:hover { background: var(--hover); }
.qz__op:active { transform: scale(0.99); }
.qz__op[aria-disabled="true"] { cursor: default; opacity: 0.6; }
.qz__op[aria-disabled="true"]:hover { background: var(--bg-2); }
.qz__op--ok, .qz__op--ok[aria-disabled="true"], .qz__op--ok[aria-disabled="true"]:hover { opacity: 1; border-color: var(--ok); background: var(--ok-suave); animation: pop .3s ease 1; }
.qz__op--mal, .qz__op--mal[aria-disabled="true"], .qz__op--mal[aria-disabled="true"]:hover { opacity: 1; border-color: var(--mal); background: var(--mal-suave); animation: tiembla .3s ease 1; }
.qz__letra { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg-4); font-weight: 900; }
.qz__op--ok .qz__letra { background: var(--ok); color: var(--sobre-color); }
.qz__op--mal .qz__letra { background: var(--mal); color: var(--sobre-color); }
.qz__optxt { min-width: 0; overflow-wrap: anywhere; }
.qz__ayuda { margin: 0; font-size: 0.875rem; color: var(--muted); }
.qz__acc { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.qz__acc .btn { flex: 1 1 220px; }
.qz__fin { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 18px 12px; border-radius: var(--radio); background: var(--bg-3); }
.qz__nota { font-family: var(--titulo); font-size: clamp(2.4rem, 2rem + 2vw, 3.4rem); line-height: 1; font-weight: 800; }
.qz__titfin { margin: 0; font-size: 1.15rem; font-weight: 800; }
.qz__intro { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); }
@keyframes pop { 50% { transform: scale(1.03); } }
@keyframes tiembla { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
/* ---------- v3.1: inicio fácil ---------- */
.heroe { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.heroe__cab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.heroe__pos { font-size: 1.05rem; }
.heroe__tit { font-size: clamp(1.5rem, 1.25rem + 1vw, 2rem); }
.btn--enorme { width: 100%; min-height: 64px; padding: 12px 20px; font-size: 1.2rem; border-radius: 16px; white-space: normal; text-align: left; line-height: 1.3; }
.btn--enorme .btn__txt { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.quedan { display: flex; flex-direction: column; gap: 8px; font-weight: 700; }
.quedan .barra { height: 10px; }
.diploma { display: flex; align-items: center; gap: 16px; padding: 18px; border: 2px solid var(--aviso); background: var(--aviso-suave); }
.diploma__sello { flex: 0 0 auto; font-size: 3rem; line-height: 1; }
.diploma__txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.diploma__txt h2 { margin: 0; }
.diploma__nombre { margin: 0; font-family: var(--titulo); font-size: 1.3rem; font-weight: 800; overflow-wrap: anywhere; }
.fiesta__diploma { white-space: normal; }
/* ---------- v3.1: vídeo ---------- */
.video-caja { gap: 6px; }
.video-pronto { display: flex; align-items: center; gap: 10px; margin: 0; width: 100%; border-radius: 14px; background: var(--bg-3); border: 1px dashed var(--linea-2); font-size: 1rem; padding: 10px 14px; }
.video-pronto__ico { font-size: 1.4rem; line-height: 1; flex: 0 0 auto; }
.video-slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 220px; width: 100%; border-radius: var(--radio); background: var(--acento-suave); border: 2px dashed var(--acento); text-align: center; padding: 20px 16px; }
.video-slot__ico { font-size: 3rem; line-height: 1; }
.video-slot__tit { margin: 0; font-weight: 800; font-size: 1.1rem; }
.video-slot .btn--enorme { max-width: 520px; text-align: center; justify-content: center; }
.video-slot .btn--enorme .btn__txt { flex: 0 1 auto; }
/* ---------- v3.1: panel de progreso ---------- */
.sin-empezar__lista { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.resumen-estado { margin: 0; font-size: 1rem; }
.recordatorio { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--bg-3); font-family: inherit; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.recordatorio__caja { gap: 8px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  function normaliza(t) { return String(t || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  // Filas del panel: equipo ∪ progreso. Cada persona del equipo se cruza con su progreso por email o nombre;
  // quien tiene progreso y no está en la lista del equipo sale igual. Estado: Sin empezar (0) · En marcha · Hecho (todas).
  function filasEquipo() {
    var total = totalLecciones(), porEmail = {}, porNombre = {}, usados = {}, filas = [];
    S.progreso.forEach(function (p, uid) {
      var pf = S.perfiles[uid] || {};
      if (pf.email) porEmail[normaliza(pf.email)] = uid;
      if (pf.name) porNombre[normaliza(pf.name)] = uid;
    });
    function estado(n) { return !n ? 'sin' : (total && n >= total ? 'hecho' : 'marcha'); }
    S.equipo.forEach(function (e) {
      if (!e || (!e.email && !e.nombre)) return;
      var uid = (e.email && porEmail[normaliza(e.email)]) || (e.nombre && porNombre[normaliza(e.nombre)]) || null;
      if (uid && usados[uid]) uid = null;
      if (uid) usados[uid] = 1;
      var n = uid ? cuentaHechas(uid) : 0;
      filas.push({ uid: uid, eq: e, n: n, estado: estado(n), ult: uid ? ultimaActividad(uid) : 0, nombre: String(e.nombre || e.email) });
    });
    S.progreso.forEach(function (p, uid) {
      if (usados[uid]) return;
      var n = cuentaHechas(uid), pf = S.perfiles[uid] || {};
      filas.push({ uid: uid, eq: null, n: n, estado: estado(n), ult: ultimaActividad(uid), nombre: String(pf.name || '') });
    });
    var ORDEN = { marcha: 0, hecho: 1, sin: 2 };
    filas.sort(function (a, b) { return ORDEN[a.estado] - ORDEN[b.estado] || b.n - a.n || b.ult - a.ult || a.nombre.localeCompare(b.nombre, 'es'); });

      var cambio = tipo === 'pdf' ? { pdf_asset: res.id, actualizado: Date.now() } : { video: { tipo: 'asset', ref: res.id }, actualizado: Date.now() };
      return (existe ? S.db.doc('lecciones/' + f._docId).update(cambio) : Promise.resolve()).then(function () {
        toast(existe ? 'Subido y guardado.' : 'Subido. Pulsa «Guardar clase».', 'ok');
      });
    }).catch(function (e) {
      var c = e && e.code;
      var m = c === 'too_large' ? 'Pesa más de ' + tamMax(tipo) + '. Pega un enlace de YouTube, Drive, Loom o Vimeo.'
        : c === 'unsupported_type' ? 'Formato no válido. Vídeo (MP4, MOV, WebM) o PDF.'
        : c === 'quota_or_state' ? 'No queda espacio para archivos. Usa un enlace.'
        : c === 'rate_limited' ? 'Demasiadas subidas seguidas. Espera un poco.'
        : 'No se pudo subir. Prueba otra vez o pega un enlace.';
      toast(m, 'mal');
    }).then(function () { S.subida = null; render(); });
  }
  function guardarLeccion(nuevo, l, cid, boton) {
    var f = S.form;
    if (!String(f.titulo).trim()) { toast('Pon un título.', 'mal'); return; }
    var recursos = [];
    for (var i = 0; i < f.recursos.length; i++) {
      var r = f.recursos[i];
      if (!String(r.url).trim() && !String(r.titulo).trim()) continue;
      if (!/^https:\/\//i.test(String(r.url).trim())) { toast('El recurso ' + (i + 1) + ' necesita un enlace que empiece por https://', 'mal'); return; }
      recursos.push({ titulo: String(r.titulo).trim().slice(0, 120) || String(r.url).trim(), url: String(r.url).trim() });
    }
    var test = [];
    for (var j = 0; j < f.test.length; j++) {
      var t = f.test[j];
      var ops = String(t.opciones || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      if (!String(t.pregunta).trim() && !ops.length) continue;
      if (!String(t.pregunta).trim() || ops.length < 2) { toast('La pregunta ' + (j + 1) + ' necesita texto y al menos 2 opciones.', 'mal'); return; }
      var corr = Math.min(Math.max(0, Number(t.correcta) || 0), ops.length - 1);
      var q = { pregunta: String(t.pregunta).trim().slice(0, 300), opciones: ops.map(function (o) { return o.slice(0, 200); }), correcta: corr };
      var expl = corta(String(t.explicacion || '').trim(), 300);
      if (expl) q.explicacion = expl;
      var pis = corta(String(t.pista || '').trim(), 200);
      if (pis) q.pista = pis;
      test.push(q);
    }
    if (String(f.enlaceVideo || '').trim()) {
      var d = detectarVideo(f.enlaceVideo);
      if (!d) { toast('El enlace de vídeo no es de YouTube, Drive, Loom ni Vimeo.', 'mal'); return; }
      f.video = d;
    }
    var lsCurso = leccionesDe(cid, true);
    var maxOrden = lsCurso.reduce(function (m, x) { return Math.max(m, Number(x.orden) || 0); }, 0);
    var min = parseInt(f.duracion_min, 10);
    var datos = {
      curso_id: cid, orden: nuevo ? maxOrden + 1 : (Number(l.orden) || maxOrden + 1),
      titulo: String(f.titulo).trim().slice(0, 160), resumen: String(f.resumen || '').trim().slice(0, 240),
      duracion_min: (min > 0 && min < 241) ? min : null,
      texto: String(f.texto || '').slice(0, 60000),
      video: (f.video && f.video.tipo) ? { tipo: f.video.tipo, ref: f.video.ref } : { tipo: null, ref: null },
      pdf_asset: f.pdf_asset || null, video_previsto: !!f.video_previsto, recursos: recursos, test: test, publicado: !!f.publicado,
      icono: corta(String(f.icono || '').trim(), 8),
      creado: nuevo ? Date.now() : (l.creado || Date.now()), actualizado: Date.now()
    };
    boton.disabled = true;
    S.db.doc('lecciones/' + f._docId).set(datos).then(function () {
      toast('Clase guardada.', 'ok');
      S.form = null;
      location.hash = '#/leccion/' + encodeURIComponent(f._docId);
    }).catch(function (e) { boton.disabled = false; toast(errorDb(e), 'mal'); });
  }

  // ------------------------------------------------------------ arranque
  // Lista opcional del equipo (solo admins). Si no existe o falla, se calla: el panel lo explica.
  function suscribirEquipo() {
    try {
      S.db.collection('equipo').onSnapshot(function (snap) {
        var antes = S.cargado.equipo ? firmaMapa(S.equipo) : null;
        S.equipo.clear();
        snap.docs.forEach(function (d) { if (d.exists) S.equipo.set(d.id, Object.assign({ id: d.id }, d.data())); });
        S.cargado.equipo = true;
        if (antes !== null && firmaMapa(S.equipo) === antes) return;
        programarRender();
      }, function () { S.cargado.equipo = true; programarRender(); });
    } catch (e) { S.cargado.equipo = true; }
  }
  function suscribir(col, mapa, clave, intento) {
    intento = intento || 0;
    S.db.collection(col).onSnapshot(function (snap) {
      // Sin cambios que se vean, no se repinta: así el eco de tus propias marcas
      // no borra «Copiado» ni lo que estás haciendo.
      var firma = clave === 'progreso' ? firmaProgreso : function () { return firmaMapa(mapa); };
      var antes = S.cargado[clave] ? firma() : null;
      mapa.clear();
      snap.docs.forEach(function (d) { if (d.exists) mapa.set(d.id, Object.assign({ id: d.id }, d.data())); });
      S.cargado[clave] = true; S.fallo[clave] = false;
      if (clave === 'progreso') sincronizarPasos();
      if (antes !== null && firma() === antes) return;
      programarRender();
    }, function (e) {
      // Sin «cargado = true»: con el mapa vacío, un set de progreso borraría lo hecho.
      if (!S.cargado[clave]) S.fallo[clave] = true;
      if (e && (e.code === 'unauthenticated' || e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled')) { S.sinDb = true; S.errorCon = errorDeConexion(e); }
      else if (e && e.code === 'unavailable' && intento < 4) {
        // El listener ha muerto (puente caído): la única forma de recuperarlo es abrir otro onSnapshot.
        setTimeout(function () { suscribir(col, mapa, clave, intento + 1); }, (1000 * Math.pow(2, intento)) + Math.random() * 1000);
      }
      else if (enGoogle() && !S.cargado[clave] && (clave === 'cursos' || clave === 'lecciones')) { S.sinDb = true; S.errorCon = errorDeConexion(e); }
      else toast('Se cortó la conexión. Recarga la página.', 'mal');
      programarRender();
    });
  }
  function firmaMapa(mapa) {
    var out = [];
    mapa.forEach(function (v, id) { out.push([id, v]); });
    out.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
    try { return JSON.stringify(out); } catch (e) { return 'x' + Date.now() + Math.random(); }
  }
  // Lo que se ve del progreso: el tuyo sin «actualizado» y con tus pasos ya unidos (local + servidor).
  function firmaProgreso() {
    var out = [];
    S.progreso.forEach(function (p, id) {
      if (id !== S.uid) { out.push([id, p]); return; }
      var c = Object.assign({}, p), vis = {}, lids = leccionesConMarcas();
      delete c.actualizado;
      if (esObj(p.pasos)) Object.keys(p.pasos).forEach(function (lid) { if (lids.indexOf(lid) < 0) lids.push(lid); });
      lids.sort().forEach(function (lid) { vis[lid] = actsHechas(lid); });
      c.pasos = vis; out.push([id, c]);
    });
    out.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
    try { return JSON.stringify(out); } catch (e) { return 'x' + Date.now() + Math.random(); }
  }
  // Por qué no hay conexión. Lo deja el puente en window.SCHOOL_ERROR; sin nada = el servidor no contestó.
  function errorDeConexion(e) {
    var x = e || window.SCHOOL_ERROR || null;
    if (!x) return { code: 'unavailable', mensaje: '', detalle: 'El servidor no ha contestado.', sesion: false, login: false };
    var det = String(x.detalle || x.mensaje || x.message || '').slice(0, 300);
    var men = String(x.mensaje || x.message || '').slice(0, 200);
    return { code: String(x.code || 'unavailable'), mensaje: men, detalle: det, sesion: !!x.sesion, login: !!x.login || x.code === 'unauthenticated' };
  }
  // Sin pase (o caducado): pantalla de entrar con la marca. Un botón grande y dos ayudas cortas.
  function vistaEntrar(e) {
    var cuenta = urlCuenta(), dom = dominioApp();
    var saltando = window.SCHOOL_SALTANDO === true; // el puente ya va solo a la puerta: el botón, por si acaso
    var caja = h('section', { class: 'tarjeta tarjeta--pad pila entrar', 'data-k': 'entrar' },
      h('h1', { class: 'entrar__titulo' }, saltando ? 'Entrando…' : 'Influentia School'),
      h('p', { class: 'entrar__lema', role: saltando ? 'status' : null }, saltando ? 'Un momento. Vamos a tu cuenta.' : ((e && e.mensaje) || 'Entra con tu cuenta de Influentia.')));
    if (cuenta) caja.appendChild(h('a', { class: 'btn btn--enorme', href: cuenta, target: '_top', rel: 'noopener', 'data-k': 'entrar-cuenta' }, h('span', { class: 'btn__txt' }, 'Entrar con tu cuenta @' + dom)));
    else caja.appendChild(h('p', { class: 'peq muted' }, 'Falta la dirección para entrar. Avisa al equipo.'));
    caja.appendChild(h('ol', { class: 'entrar__ayuda', 'data-k': 'entrar-ayuda', 'aria-label': 'Cómo entrar' },
      h('li', null, h('span', { class: 'entrar__num' }, '1'), h('span', null, 'Elige la cuenta con tu nombre ', h('b', { class: 'nowrap' }, '(@' + dom + ')'))),
      h('li', null, h('span', { class: 'entrar__num' }, '2'), h('span', null, 'Pulsa ', h('b', { class: 'nowrap' }, 'Entrar a la School')))));
    return caja;
  }
  // Sin conexión: frase corta, botón grande para entrar con otra cuenta si hace falta, detalle y Reintentar.
  function vistaSinConexion() {
    var e = S.errorCon || errorDeConexion(null);
    if (e.login) return vistaEntrar(e);
    var sinPermiso = e.code === 'not_granted' || e.code === 'revoked';
    var cuenta = (sinPermiso || e.sesion) ? urlCuenta() : '';
    var caja = h('section', { class: 'tarjeta tarjeta--pad pila sin-conexion', role: 'status', 'data-k': 'sin-conexion' },
      h('span', { class: 'sin-conexion__ico', 'aria-hidden': 'true' }, icono('alerta')),
      h('h2', { class: 'sin-conexion__titulo' }, sinPermiso ? 'Esta cuenta no puede entrar.' : 'No hay conexión.'),
      h('p', { class: 'sin-conexion__texto' }, sinPermiso ? (e.mensaje || 'Prueba con tu cuenta de Influentia.') : 'Prueba otra vez en un momento.'));
    if (cuenta) caja.appendChild(h('a', { class: 'btn btn--enorme', href: cuenta, target: '_top', rel: 'noopener', 'data-k': 'entrar-cuenta' }, h('span', { class: 'btn__txt' }, sinPermiso ? 'Entrar con otra cuenta' : 'Entrar con tu cuenta @' + dominioApp())));
    // Reintentar es lo principal (botón grande), salvo si lo que falta es otra cuenta.
    var re = h('button', { type: 'button', class: cuenta ? 'btn btn--fantasma sin-conexion__otra' : 'btn btn--enorme', 'data-k': 'reintentar' }, h('span', { class: 'btn__txt' }, 'Reintentar'));
    re.addEventListener('click', reintentarConexion);
    caja.appendChild(re);
    caja.appendChild(h('p', { class: 'sin-conexion__ayuda' }, 'Si sigue igual, avisa al equipo.'));
    // El detalle técnico no se ve: va a la consola y queda plegado en «Ver detalle técnico» (para pasárselo al equipo).
    if (e.detalle && !(sinPermiso && e.detalle === e.mensaje)) {
      try { console.warn('[School] sin conexión:', e.code, e.detalle); } catch (x) { /* sin consola */ }
      caja.appendChild(h('details', { class: 'sin-conexion__detalle' },
        h('summary', null, 'Ver detalle técnico'),
        h('p', { 'data-k': 'error-detalle' }, e.code + ' · ' + e.detalle)));
    }
    return caja;
  }
  function reintentarConexion() {
    // Si la conexión se cortó después de arrancar, lo limpio es abrir la web de nuevo (mismo enlace).
    if (S.db) {
      var u = urlApp();
      try { if (u) window.open(u, '_top'); else location.reload(); } catch (e) { location.reload(); }
      return;
    }
    S.sinDb = false; S.errorCon = null; S.arrancado = false;
    S.user = null; S.yo = null; S.uid = null; S.admin = false; S.dueno = false;
    cargaDesde = 0; if (cargaReloj) { clearTimeout(cargaReloj); cargaReloj = null; }
    arrancar();
  }
  function arrancar() {
    render();
    if (!C) { S.sinDb = true; S.arrancado = true; render(); return; }
    var pUser = C.use('user').catch(function () { return null; });
    var pDb = C.use('db').catch(function () { return null; });
    Promise.all([pUser, pDb]).then(function (r) {
      S.user = r[0]; S.db = r[1];
      return S.user ? S.user.me().then(function (me) { S.yo = me; S.uid = me.id; S.admin = !!me.canEdit; S.dueno = !!me.isOwner; }) : null;
    }).then(function () {
      S.arrancado = true;
      if (!S.db) { S.sinDb = true; S.errorCon = errorDeConexion(null); render(); return; }
      S.errorCon = null;
      suscribir('cursos', S.cursos, 'cursos');
      suscribir('lecciones', S.lecciones, 'lecciones');
      suscribir('progreso', S.progreso, 'progreso');
      suscribir('preguntas', S.preguntas, 'preguntas');
      suscribir('respuestas', S.respuestas, 'respuestas');
      if (S.admin) suscribirEquipo();
      render();
      if (S.admin) C.use('assets').then(function (a) { S.assets = a; programarRender(); }).catch(function () { S.assets = null; });
    }).catch(function (e) {
      S.arrancado = true; S.sinDb = true; S.errorCon = errorDeConexion(e); render();
    });
  }
  arrancar();
})();
</script>
</body>
